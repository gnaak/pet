; GeekMagic SmallTV-Ultra (ESP8266 · ESP-12F · 4MB 플래시 · 240x240 ST7789)
; 빌드: pio run  →  .pio/build/ultra/firmware.bin
; 그림 · 글자 데이터는 python tools/assets.py 로 src/assets.h 를 먼저 만든다

[env:ultra]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
lib_deps =
	moononournation/GFX Library for Arduino@^1.6.4
	bblanchon/ArduinoJson@^7.4.2
